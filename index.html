<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tempo</title>
<style>
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --line:#38383A;
    --txt:#FFF; --mut:#98989D; --dim:#636366;
    --study:#5E5CE6; --work:#64D2FF; --transport:#98989D; --body:#30D158;
    --sleep:#BF5AF2; --rest:#66D4CF; --leak:#FF453A; --flame:#FF9F0A;
  }
  body.wt-light{
    --bg:#F5F5F7; --card:#fff; --card2:#F0F0F2; --line:#E5E5EA;
    --txt:#3A3A3C; --mut:#6C6C70; --dim:#8A8A8E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  input{cursor:text;user-select:text;-webkit-user-select:text;}
  input:focus{user-select:text;-webkit-user-select:text;}
  html,body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
    height:100%;overscroll-behavior:none;touch-action:manipulation}
  body{padding:max(env(safe-area-inset-top),16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .hide{display:none!important}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  header h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
  header .date{font-size:13px;color:var(--mut);font-weight:500}
  .streak{display:flex;align-items:center;gap:6px;background:var(--card);
    border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--flame)}
  .gear{background:var(--card);border:none;color:var(--mut);width:36px;height:36px;
    border-radius:50%;font-size:17px;margin-left:8px}

  .session{background:rgba(28,28,30,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:22px 20px 20px;margin-bottom:14px;text-align:center}
  .session .label{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
  .session .bname{font-size:24px;font-weight:700;margin:4px 0 14px}
  .ringwrap{position:relative;width:230px;height:230px;margin:0 auto 10px}
  .ringwrap svg{transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:var(--card2);stroke-width:14}
  .ring-fg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
  .timer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .timer .t{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
  .timer .avg{font-size:12px;color:var(--mut);margin-top:8px;font-weight:500}
  .endbtn{width:100%;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;
    color:#000;margin-top:6px;transition:transform .1s}
  .endbtn:active{transform:scale(.97)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .stat{background:rgba(28,28,30,0.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:14px 16px}
  .stat .k{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
  .stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;color:var(--dim);font-weight:600}
  .bar{height:5px;background:var(--card2);border-radius:3px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}

  .nudge{position:fixed;left:12px;right:12px;bottom:max(env(safe-area-inset-bottom),12px);
    background:rgba(28,28,30,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--line);border-radius:22px;padding:18px;z-index:50;
    transform:translateY(140%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
  .nudge.show{transform:translateY(0)}
  .nudge h3{font-size:16px;font-weight:700;margin-bottom:4px}
  .nudge p{font-size:14px;color:var(--mut);line-height:1.45}
  .nudge .row{display:flex;gap:10px;margin-top:14px}
  .nudge button{flex:1;border:none;border-radius:13px;padding:13px;font-size:15px;font-weight:700}
  .nudge .yes{background:var(--txt);color:#000}
  .nudge .no{background:var(--card2);color:var(--txt)}

  .secthead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
  .secthead h2{font-size:17px;font-weight:700}
  .secthead span{font-size:13px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
  .tl{display:flex;flex-direction:column;gap:8px}
  .tl .item{background:var(--card);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px}
  .tl .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .tl .nm{flex:1;font-size:15px;font-weight:600}
  .tl .nm small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
  .tl .dur{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mut)}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:26px 0}

  .picker .ph{margin:8px 2px 4px}
  .picker .ph h2{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .picker .ph p{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.5}
  .done{background:var(--card);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;margin:14px 0 6px}
  .done .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .done .tx{flex:1}
  .done .tx b{font-size:15px;font-weight:700;display:block}
  .done .tx span{font-size:13px;color:var(--mut)}
  .done .d{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .bcard{background:rgba(28,28,30,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08)!important;border-radius:20px;padding:18px 16px;text-align:left;
    color:var(--txt);position:relative;overflow:hidden;transition:transform .1s}
  .bcard:active{transform:scale(.96)}
  .bcard .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:20px;margin-bottom:12px}
  .bcard .n{font-size:16px;font-weight:700;line-height:1.2}
  .bcard .e{font-size:12px;color:var(--mut);font-weight:500;margin-top:4px}
  .bcard .edge{position:absolute;top:0;left:0;right:0;height:4px}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end}
  .sheet .in{background:rgba(28,28,30,0.92);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-top:1px solid rgba(255,255,255,0.1);width:100%;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:85vh;overflow:auto}
  .sheet h2{font-size:19px;font-weight:800;margin-bottom:14px}
  .prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--card2)}
  .prow .dot{width:10px;height:10px;border-radius:50%}
  .prow .nm{flex:1;font-size:15px;font-weight:600}
  .prow input{width:64px;background:var(--card2);border:none;border-radius:10px;color:var(--txt);
    font-size:15px;font-weight:700;padding:8px;text-align:center;font-variant-numeric:tabular-nums}
  .prow span{font-size:12px;color:var(--dim)}
  .sheet .acts{display:flex;gap:10px;margin-top:18px}
  .sheet .acts button{flex:1;border:none;border-radius:13px;padding:13px;font-size:15px;font-weight:700}
  .pri{background:var(--txt);color:#000}.sec{background:var(--card2);color:var(--txt)}
  .danger{background:none;border:none;color:var(--leak);font-size:13px;font-weight:600;margin:16px auto 0;display:block}
  #tabTempo, #tabStudy, #tabWork { transition: transform .1s; }
  #tabTempo:active, #tabStudy:active, #tabWork:active { transform: scale(.95); }
</style>
</head>
<body ontouchstart="">

<div id="wt-access-gate" style="position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif">
  <div style="max-width:340px;margin:0 auto;width:100%">
    <div style="text-align:center;margin-bottom:32px">
      <svg width="14" height="16" viewBox="0 0 14 16" fill="#5E5CE6" style="margin-bottom:12px"><path d="M7 0C7 0 11.5 3.6 11.5 8.2 13 7.3 13.4 5.6 13.4 5.6 14 7 14 8.6 14 9.5 14 13.1 10.9 16 7 16 3.1 16 0 13.1 0 9.5 0 5.3 4.2 4.4 7 0Z"/></svg>
      <div style="font-size:24px;font-weight:800;color:#fff">Tempo</div>
      <div style="font-size:13px;color:#98989D;margin-top:6px">Enter your access code to continue</div>
    </div>
    <input id="wt-ag-input" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX"
      style="width:100%;box-sizing:border-box;background:#1C1C1E;border:1px solid #3A3A3C;border-radius:14px;color:#fff;font-size:20px;font-weight:700;text-align:center;letter-spacing:2px;padding:16px;margin-bottom:14px">
    <div id="wt-ag-error" style="color:#FF453A;font-size:13px;text-align:center;margin-bottom:14px;display:none"></div>
    <button id="wt-ag-submit" style="width:100%;background:#5E5CE6;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;padding:15px;cursor:pointer">Unlock</button>
  </div>
</div>

<div id="wt-expiry-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:#FF9F0A;color:#000;font-size:13px;font-weight:700;padding:10px 16px;text-align:center"></div>

<script>
(function() {
  const GOD_CODE = 'MODODIOS';
  const ACCESS_KEY = 'wt_access_v1';
  const gate = document.getElementById('wt-access-gate');
  const input = document.getElementById('wt-ag-input');
  const errorEl = document.getElementById('wt-ag-error');
  const submitBtn = document.getElementById('wt-ag-submit');
  const banner = document.getElementById('wt-expiry-banner');

  function getAccess() {
    try { return JSON.parse(localStorage.getItem(ACCESS_KEY)); } catch (e) { return null; }
  }
  function isValid(access) {
    if (!access) return false;
    if (access.expiresAt === null) return true; // god mode — never expires
    return new Date(access.expiresAt).getTime() > Date.now();
  }
  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  input.addEventListener('input', () => {
    let v = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4, 8);
    input.value = v;
  });

  async function tryUnlock() {
    const raw = input.value.trim().toUpperCase();
    if (!raw) return;
    const normalized = raw.replace(/-/g, '');
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking...';

    if (normalized === GOD_CODE) {
      localStorage.setItem(ACCESS_KEY, JSON.stringify({ code: 'GOD', expiresAt: null, activatedAt: new Date().toISOString() }));
      unlockApp(null);
      return;
    }

    try {
      const res = await fetch('access-codes.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed');
      const data = await res.json();
      const entry = (data.codes || []).find(c => c.code.replace(/-/g, '') === normalized && !c.used);
      if (!entry) {
        showError('Invalid or already-used code. Please check and try again.');
        submitBtn.disabled = false; submitBtn.textContent = 'Unlock';
        return;
      }
      const expiresAt = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();
      localStorage.setItem(ACCESS_KEY, JSON.stringify({ code: raw, expiresAt, activatedAt: new Date().toISOString() }));
      unlockApp(expiresAt);
    } catch (e) {
      showError('Could not verify your code — check your internet connection and try again.');
      submitBtn.disabled = false; submitBtn.textContent = 'Unlock';
    }
  }

  function unlockApp(expiresAt) {
    if (expiresAt) {
      gate.innerHTML = `
        <div style="max-width:340px;margin:0 auto;width:100%;text-align:center">
          <div style="font-size:40px;margin-bottom:16px">🎉</div>
          <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:10px">Access granted!</div>
          <div style="font-size:14px;color:#98989D;line-height:1.6;margin-bottom:24px">Welcome to Tempo. Your access is active for the next 30 days, until <strong style="color:#fff">${fmtDate(expiresAt)}</strong>. We hope you enjoy the experience.</div>
          <button id="wt-ag-continue" style="width:100%;background:#5E5CE6;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;padding:15px;cursor:pointer">Continue</button>
        </div>`;
      document.getElementById('wt-ag-continue').onclick = () => { gate.style.display = 'none'; checkExpiryBanner(); };
    } else {
      gate.style.display = 'none';
    }
  }

  function checkExpiryBanner() {
    const access = getAccess();
    if (!access || access.expiresAt === null) return;
    const daysLeft = Math.ceil((new Date(access.expiresAt).getTime() - Date.now()) / 86400000);
    if (daysLeft > 0 && daysLeft <= 3) {
      banner.textContent = `⏳ Your Tempo access expires in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}.`;
      banner.style.display = 'block';
    }
  }

  submitBtn.onclick = tryUnlock;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  const existing = getAccess();
  if (isValid(existing)) {
    gate.style.display = 'none';
    checkExpiryBanner();
  }
})();
</script>

<header>
  <div><h1 id="hTitle">Tempo</h1><div class="date" id="hDate"></div></div>
  <div style="display:flex;align-items:center">
    <div class="streak"><svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M7 0C7 0 11.5 3.6 11.5 8.2 13 7.3 13.4 5.6 13.4 5.6 14 7 14 8.6 14 9.5 14 13.1 10.9 16 7 16 3.1 16 0 13.1 0 9.5 0 5.3 4.2 4.4 7 0Z"/></svg><span id="streakN">0</span></div>
    <button class="gear" id="gearBtn" aria-label="Settings">&#9881;&#65038;</button>
  </div>
</header>

<!-- TABS -->
<div id="mainTabBar" style="display:flex;gap:8px;margin-bottom:16px">
  <button id="tabTempo" onclick="switchTab('tempo')" style="flex:1;padding:10px 6px;border:none;border-radius:14px;font-size:12px;font-weight:700;background:#5E5CE6;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Tempo
  </button>
  <button id="tabStudy" onclick="switchTab('study')" style="flex:1;padding:10px 6px;border:none;border-radius:14px;font-size:12px;font-weight:700;background:var(--card2);color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L2 6l8 4 8-4-8-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 6v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 8.5v4.5c0 1.1 1.8 2 4 2s4-.9 4-2V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Study
  </button>
  <button id="tabWork" onclick="switchTab('work')" style="flex:1;padding:10px 6px;border:none;border-radius:14px;font-size:12px;font-weight:700;background:var(--card2);color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="7" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7V5a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 11h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Work
  </button>
</div>
<div id="wt-root" class="hide"></div>
<div id="st-root" class="hide"></div>

    <div class="label">Current session</div>
    <div class="bname" id="lName"></div>

      <svg width="230" height="230" viewBox="0 0 230 230">

<section id="vPicker" class="picker">

  <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px">

    <button id="toggleModeBtn" style="background:rgba(28,28,30,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:20px;color:#98989D;font-size:12px;font-weight:700;padding:6px 14px;cursor:pointer">

    <h2>Settings</h2>

    <button class="danger" id="wipeBtn">Delete all data</button>

<script>
const BUCKET_ICONS = {
  study: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L2 6l8 4 8-4-8-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 6v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 8.5v4.5c0 1.1 1.8 2 4 2s4-.9 4-2V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  work:  `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="7" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7V5a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 11h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  transport: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 10h14" stroke="currentColor" stroke-width="1.5"/><circle cx="6.5" cy="15.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><circle cx="13.5" cy="15.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 5V4a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/></svg>`,
  body:  `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="4" r="2" stroke="currentColor" stroke-width="1.5"/><path d="M4 9h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10 9v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 17l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  sleep: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17 11A7 7 0 119 3a5 5 0 008 8z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  rest:  `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10a6 6 0 1112 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 10h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  leak:  `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="2" width="10" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 5h4M8 8h4M8 11h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
};
const BUCKETS = [
  {id:'study', name:'Study PM',    col:'var(--study)', hex:'#5E5CE6', exp:120},
  {id:'work',  name:'Work',        col:'var(--work)',  hex:'#64D2FF', exp:180},
  {id:'transport', name:'Transport', col:'var(--transport)', hex:'#98989D', exp:45},
  {id:'body',  name:'Body',        col:'var(--body)',  hex:'#30D158', exp:60},
  {id:'sleep', name:'Sleep',       col:'var(--sleep)', hex:'#BF5AF2', exp:450},
  {id:'rest',  name:'Rest',        col:'var(--rest)',  hex:'#66D4CF', exp:45},
  {id:'leak',  name:'Leak',        col:'var(--leak)',  hex:'#FF453A', exp:15},
];
const $ = id => document.getElementById(id);
const KEY = 'tempo_v1';

let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  const params = {}; BUCKETS.forEach(b => params[b.id] = b.exp);
  return {events:[], current:null, params, nudgeDismissedAt:0};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
const bucket = id => BUCKETS.find(b => b.id === id);

function bucketName(id) {
  const b = BUCKETS.find(b => b.id === id);
  if (!b) return id;
  return (S.names && S.names[id]) ? S.names[id] : b.name;
}

function fmtClock(s){
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
}
function fmtH(s){
  const h = Math.floor(s/3600), m = Math.round(s%3600/60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }

function avgFor(id){
  const done = S.events.filter(e => e.b === id);
  if (done.length >= 3) return done.reduce((a,e)=>a+(e.end-e.start),0)/done.length/1000;
  return S.params[id]*60;
}
function todayEvents(){ const t0 = startOfDay(Date.now()); return S.events.filter(e => e.end > t0); }
function todayTotal(id){
  const t0 = startOfDay(Date.now());
  let s = todayEvents().filter(e => !id || e.b === id).reduce((a,e)=>a+(e.end-Math.max(e.start,t0)),0);
  if (S.current && (!id || S.current.b === id)) s += Date.now()-Math.max(S.current.start, startOfDay(Date.now()));
  return s/1000;
}
function streak(){
  let n = 0, day = startOfDay(Date.now());
  for(;;){
    const has = S.events.some(e => e.end > day && e.start < day + 864e5) || (n===0 && S.current);
    if (has){ n++; day -= 864e5; } else break;
  }
  return n;
}

const CIRC = 2*Math.PI*104;
$('ringFg').style.strokeDasharray = CIRC;

function startActivity(id){
  S.current = {b:id, start:Date.now(), pausedMs:0, pausedAt:null}; S.nudgeDismissedAt = 0; save(); render();
}
function pauseActivity(){
  if(!S.current || S.current.pausedAt) return;
  S.current.pausedAt = Date.now(); save();
  if(simpleMode) _renderSimple(); else render();
}
function resumeActivity(){
  if(!S.current || !S.current.pausedAt) return;
  S.current.pausedMs = (S.current.pausedMs||0) + (Date.now() - S.current.pausedAt);
  S.current.pausedAt = null; save();
  if(simpleMode) _renderSimple(); else render();
}
window.pauseActivity = pauseActivity;
window.resumeActivity = resumeActivity;
function endActivity(){
  if(!S.current) return null;
  const now = Date.now();
  const pausedMs = (S.current.pausedMs||0) + (S.current.pausedAt ? now - S.current.pausedAt : 0);
  const ev = {b:S.current.b, start:S.current.start, end:now, pausedMs};
  const activeMs = ev.end - ev.start - pausedMs;
  if (activeMs >= 30000) S.events.push(ev);
  S.current = null; save();
  return ev;
}

let lastEnded = null;
$('endBtn').onclick = () => { hideNudge(); lastEnded = endActivity(); render(); };
$('nYes').onclick  = () => { hideNudge(); lastEnded = endActivity(); render(); };
$('nNo').onclick   = () => { S.nudgeDismissedAt = Date.now(); save(); hideNudge(); };
function hideNudge(){ $('nudge').classList.remove('show'); }

// ── VIEW MODE TOGGLE ──────────────────────────────────
let simpleMode = localStorage.getItem('tempo_simple_mode') === 'true';

function _renderSimple() {
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const todayEvents = (S.events || []).filter(e => {
    const d = new Date(e.start);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return ds === todayStr;
  });
  
  const list = document.getElementById('bucketList');
  if (!list) return;
  
  list.innerHTML = BUCKETS.map(b => {
    const name = bucketName(b.id);
    const totalMs = todayEvents
      .filter(e => e.b === b.id && e.end)
      .reduce((sum, e) => sum + (e.end - e.start), 0);
    const totalMins = Math.floor(totalMs / 60000);
    const hrs = Math.floor(totalMins / 60);
    const mins = totalMins % 60;
    const decimal = (totalMins / 60).toFixed(2);
    const timeStr = hrs > 0
      ? `${hrs}h ${mins}m · ${decimal}h`
      : mins > 0 ? `${mins}m · ${decimal}h` : `—`;
    const isActive = S.current && S.current.b === b.id;
    const iconSvg = `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${isActive ? b.hex : '#636366'}">${(BUCKET_ICONS[b.id]||'').replace(/^<svg[^>]*>/,'').replace('</svg>','')}</svg>`;
    return `
      <div style="display:flex;align-items:center;gap:14px;background:${isActive ? b.hex+'18' : 'rgba(28,28,30,0.55)'};
        backdrop-filter:blur(16px);border:1px solid ${isActive ? b.hex+'60' : 'rgba(255,255,255,0.07)'};
        border-radius:18px;padding:14px 16px;cursor:pointer;transition:all .2s;
        ${isActive ? `box-shadow:0 0 0 1px ${b.hex}30` : ''}"
        onclick="${isActive ? '' : `startBucket('${b.id}')`}">
        <div style="width:40px;height:40px;border-radius:50%;background:${isActive ? b.hex+'30' : b.hex+'15'};
          display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s">
          ${iconSvg}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:600;color:${isActive ? '#fff' : '#ebebf5'}">${name}</div>
          <div style="font-size:11px;color:${isActive ? b.hex+'cc' : '#48484a'};margin-top:2px;font-variant-numeric:tabular-nums">${timeStr}</div>
        </div>
        ${isActive
          ? `<div style="display:flex;align-items:center;gap:8px">
              <div id="simple-timer-${b.id}" style="font-size:15px;font-weight:700;color:${b.hex};font-variant-numeric:tabular-nums;min-width:44px;text-align:right">00:00</div>
              <button type="button" id="simpleResumeBtn-${b.id}" onclick="event.stopPropagation();window.resumeActivity();"
                style="width:36px;height:36px;border-radius:50%;background:rgba(255,159,10,.15);border:1.5px solid rgba(255,159,10,.5);color:#FF9F0A;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                ↺
              </button>
              <button type="button" id="simplePauseBtn-${b.id}" onclick="event.stopPropagation();window.pauseActivity();"
                style="width:36px;height:36px;border-radius:50%;background:rgba(255,159,10,.15);border:1.5px solid rgba(255,159,10,.5);color:#FF9F0A;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                ⏸
              </button>
              <button type="button" onclick="event.stopPropagation();window.endCurrent();"
                style="width:36px;height:36px;border-radius:50%;background:rgba(255,69,58,.15);border:1.5px solid rgba(255,69,58,.4);color:#FF453A;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                ■
              </button>
            </div>`
          : `<div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center">
              <svg width="10" height="12" viewBox="0 0 10 12" fill="${b.hex}" xmlns="http://www.w3.org/2000/svg"><path d="M0 0l10 6-10 6V0z"/></svg>
            </div>`
        }
      </div>`;
  }).join('');

  window.togglePause = function() {
    console.log('togglePause CLICKED', S.current);
    if (!S.current) return;
    if (S.current.pausedAt) resumeActivity(); else pauseActivity();
  };

  // Live timer update for active bucket
  if (S.current) {
    const updateSimpleTimer = () => {
      if (!S.current) { clearInterval(window._simpleTimerInterval); return; }
      if (S.current.pausedAt) return; // pausado, no actualizar
      const el = document.getElementById('simple-timer-' + S.current.b);
      if (!el) return;
      const pausedMs = S.current.pausedMs || 0;
      const elapsed = Date.now() - S.current.start - pausedMs;
      const s = Math.floor(elapsed / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      el.textContent = h > 0
        ? `${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    };
    updateSimpleTimer();
    clearInterval(window._simpleTimerInterval);
    window._simpleTimerInterval = setInterval(updateSimpleTimer, 1000);
  }
}

function startBucket(bucketId) {
  // Si es el bucket activo: toggle pause/resume
  if (S.current && S.current.b === bucketId) {
    if (S.current.pausedAt) resumeActivity(); else pauseActivity();
    return;
  }
  // Si hay otro activo, terminarlo antes
  if (S.current) { lastEnded = endActivity(); }
  // Countdown modal tipo Apple Watch
  const hex = (BUCKETS.find(b => b.id === bucketId) || {}).hex || '#fff';
  const name = bucketName(bucketId);
  const icon = BUCKET_ICONS[bucketId] || '';

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px)';
  ov.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px">
      <div style="width:80px;height:80px;border-radius:50%;background:${hex}20;display:flex;align-items:center;justify-content:center;color:${hex}">
        <svg width="36" height="36" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${hex}">${(BUCKET_ICONS[bucketId]||'').replace(/^<svg[^>]*>/,'').replace('</svg>','')}</svg>
      </div>
      <div style="font-size:22px;font-weight:700;color:#fff">${name}</div>
      <div id="cdNum" style="font-size:96px;font-weight:800;color:${hex};font-variant-numeric:tabular-nums;line-height:1;transition:transform .1s">3</div>
      <button id="cdCancel" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:20px;color:#fff;font-size:15px;font-weight:600;padding:10px 32px;cursor:pointer">Cancel</button>
    </div>`;
  document.body.appendChild(ov);

  let count = 3;
  let cancelled = false;
  document.getElementById('cdCancel').onclick = () => { cancelled = true; ov.remove(); };

  const tick = setInterval(() => {
    if (cancelled) { clearInterval(tick); return; }
    count--;
    if (count <= 0) {
      clearInterval(tick);
      ov.remove();
      startActivity(bucketId);
      if (simpleMode) _renderSimple();
    } else {
      const el = document.getElementById('cdNum');
      if (el) { el.textContent = count; el.style.transform='scale(1.2)'; setTimeout(()=>{ if(el) el.style.transform='scale(1)'; },100); }
    }
  }, 1000);
}

function endCurrent() {
  hideNudge(); lastEnded = endActivity();
  if (simpleMode) _renderSimple();
  else render();
}
window.endCurrent = endCurrent;

function _applyMode() {
  const simple = document.getElementById('vSimple');
  const advanced = document.getElementById('vAdvanced');
  const btn = document.getElementById('toggleModeBtn');
  if (!simple || !advanced || !btn) return;
  
  if (simpleMode) {
    simple.classList.remove('hide');
    advanced.classList.add('hide');
    btn.textContent = 'Advanced';
    btn.style.color = '#5E5CE6';
    _renderSimple();
  } else {
    simple.classList.add('hide');
    advanced.classList.remove('hide');
    btn.textContent = 'Simple';
    btn.style.color = '#98989D';
    render();
  }
}

function render(){
  $('hDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'short'});
  $('streakN').textContent = streak();
  if (S.current){ $('vLive').classList.remove('hide'); $('vPicker').classList.add('hide'); renderLive(); }
  else { $('vLive').classList.add('hide'); $('vPicker').classList.remove('hide'); renderPicker(); }
}

function renderLive(){
  const b = bucket(S.current.b);
  $('lName').textContent = bucketName(b.id);
  $('lName').style.color = b.col;
  $('ringFg').style.stroke = b.hex;
  $('endBtn').style.background = b.hex;
  $('lAvg').textContent = 'Esperado: ' + fmtH(avgFor(b.id));
  renderStats(); renderTimeline(); tick();
}

function tick(){
  if (!S.current) return;
  const el = Math.floor((Date.now()-S.current.start)/1000);
  $('lTimer').textContent = fmtClock(el);
  const exp = avgFor(S.current.b);
  $('ringFg').style.strokeDashoffset = CIRC * (1 - Math.min(el/exp, 1));
  if (el > exp && Date.now() - S.nudgeDismissedAt > 15*60000 && !$('nudge').classList.contains('show')){
    const b = bucket(S.current.b);
    $('nudgeTxt').textContent = `You have spent ${fmtH(el)} on ${b.name} and your expected duration is ${fmtH(exp)}. Close this block?`;
    $('nudge').classList.add('show');
  }
}
setInterval(tick, 1000);
setInterval(()=>{ if(S.current){ renderStats(); $('streakN').textContent = streak(); } }, 30000);

function renderStats(){
  const st = todayTotal('study'), lk = todayTotal('leak');
  $('sStudy').innerHTML = fmtH(st) + ' <small>/ 5h</small>';
  $('sStudyBar').style.width = Math.min(st/(5*3600)*100,100)+'%';
  $('sLeak').textContent = fmtH(lk);
  $('sLeakBar').style.width = Math.min(lk/(2*3600)*100,100)+'%';
  $('todayTotal').textContent = fmtH(todayTotal());
}

function renderTimeline(){
  const evs = todayEvents().slice(-12).reverse();
  $('timeline').innerHTML = evs.length ? evs.map(e => {
    const b = bucket(e.b);
    const t = d => new Date(d).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    return `<div class="item"><div class="dot" style="background:${b.hex}"></div>
      <div class="nm">${bucketName(b.id)}<small>${t(e.start)} — ${t(e.end)}</small></div>
      <div class="dur" ${e.b==='leak'?'style="color:var(--leak)"':''}>${fmtH((e.end-e.start)/1000)}</div></div>`;
  }).join('') : '<div class="empty">No blocks yet today.</div>';
}

function renderPicker(){
  if (lastEnded){
    const b = bucket(lastEnded.b);
    const dur = (lastEnded.end-lastEnded.start)/1000, exp = avgFor(b.id);
    const diff = dur-exp;
    $('doneCard').innerHTML = `<div class="done">
      <div class="ic" style="background:${b.hex}22;color:${b.hex};display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${b.hex}">${(BUCKET_ICONS[b.id]||'').replace(/^<svg[^>]*>/,'').replace('</svg>','')}</svg></div>
      <div class="tx"><b>${bucketName(b.id)} registrado</b>
      <span>${diff>=0?'+':'−'}${fmtH(Math.abs(diff))} vs esperado</span></div>
      <div class="d" style="color:${b.hex}">${fmtH(dur)}</div></div>`;
    $('pTitle').textContent = '¿Qué sigue?';
  } else { $('doneCard').innerHTML=''; $('pTitle').textContent='¿Con qué empezamos?'; }
  const list = BUCKETS.filter(b => !lastEnded || b.id !== lastEnded.b);
  $('bGrid').innerHTML = list.map(b => `
    <button class="bcard" onclick="startActivity('${b.id}')">
      <div class="edge" style="background:${b.hex}"></div>
      <div class="ic" style="background:${b.hex}22;color:${b.hex}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:${b.hex}">${(BUCKET_ICONS[b.id]||'').replace(/^<svg[^>]*>/,'').replace('</svg>','')}</svg></div>
      <div class="n">${bucketName(b.id)}</div>
      <div class="e">~${fmtH(avgFor(b.id))} por sesión</div>
    </button>`).join('');
}

$('gearBtn').onclick = () => {
$('pList').innerHTML = BUCKETS.map(b => `
    <div class="prow">
      <div class="dot" style="background:${b.hex}"></div>
      <input type="text" id="n_${b.id}" value="${S.names && S.names[b.id] ? S.names[b.id] : b.name}"
        style="flex:1;background:#2C2C2E;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;padding:8px 10px;outline:none;min-width:0"

      <div style="display:flex;align-items:center;gap:0;background:#2C2C2E;border-radius:10px;overflow:hidden;margin-left:8px">

          style="width:36px;height:36px;background:none;border:none;color:#98989D;font-size:20px;font-weight:200;cursor:pointer;line-height:1"
          onpointerdown="this.style.background='rgba(255,255,255,0.12)';this.style.color='#fff'"
          onpointerup="this.style.background='none';this.style.color='#98989D'"
          onpointerleave="this.style.background='none';this.style.color='#98989D'">−</button>
        <input type="text" inputmode="numeric" id="p_${b.id}" value="${S.params[b.id]}"
          style="width:44px;background:none;border:none;color:#fff;font-size:15px;font-weight:700;text-align:center;padding:0;outline:none;font-variant-numeric:tabular-nums"
          onclick="this.select()" onfocus="this.select()">
        <button onclick="document.getElementById('p_${b.id}').value=Math.min(720,parseInt(document.getElementById('p_${b.id}').value||5)+5)"
          style="width:36px;height:36px;background:none;border:none;color:#98989D;font-size:18px;font-weight:200;cursor:pointer;line-height:1"
          onpointerdown="this.style.background='rgba(255,255,255,0.12)';this.style.color='#fff'"
          onpointerup="this.style.background='none';this.style.color='#98989D'"
          onpointerleave="this.style.background='none';this.style.color='#98989D'">+</button>
      </div>
      <span style="font-size:12px;color:#636366;margin-left:6px">min</span>
    </div>`).join('');
    document.querySelectorAll('#pList input').forEach(i => { i.addEventListener('focus', () => i.select()); i.addEventListener('click', () => i.select()); });
  $('settings').classList.remove('hide');
};
$('saveBtn').onclick = () => {
  if (!S.names) S.names = {};
  BUCKETS.forEach(b => {
    const v = parseInt($('p_'+b.id).value);
    if (v > 0) S.params[b.id] = v;
    const nameInput = document.getElementById('n_'+b.id);
    if (nameInput && nameInput.value.trim()) S.names[b.id] = nameInput.value.trim();
  });
  save(); $('settings').classList.add('hide'); render();
};
$('settings').onclick = e => { if(e.target === $('settings')) $('settings').classList.add('hide'); };
$('expBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'tempo-data.json'; a.click();
};
$('wipeBtn').onclick = () => {
  if (confirm('Delete ALL data? This cannot be undone.')){
    localStorage.removeItem(KEY); location.reload();
  }
};

let studyMounted = false;
let workMounted = false;

function switchTab(tab) {
  const isTempo = tab === 'tempo';
  const isWork = tab === 'work';
  const isStudy = tab === 'study';

  $('tabTempo').style.background = isTempo ? '#5E5CE6' : 'var(--card2)';
  $('tabTempo').style.color = isTempo ? '#fff' : 'var(--muted)';

  $('tabStudy').style.background = isStudy ? '#5E5CE6' : 'var(--card2)';
  $('tabStudy').style.color = isStudy ? '#fff' : 'var(--muted)';

  $('tabWork').style.background = isWork ? '#64D2FF' : 'var(--card2)';
  $('tabWork').style.color = isWork ? '#000' : 'var(--muted)';

  $('vLive').classList.toggle('hide', !isTempo);
  $('vPicker').classList.toggle('hide', !isTempo);
  $('wt-root').classList.toggle('hide', !isWork);
  $('st-root').classList.toggle('hide', !isStudy);

  if (isWork && !workMounted) { WorkTracker.mount($('wt-root')); workMounted = true; }
  else if (isWork) { WorkTracker.mount($('wt-root')); }

  if (isStudy && !studyMounted) { StudyTracker.mount($('st-root')); studyMounted = true; }
  else if (isStudy) { StudyTracker.mount($('st-root')); }
}

document.getElementById('toggleModeBtn').onclick = () => {
  simpleMode = !simpleMode;
  localStorage.setItem('tempo_simple_mode', simpleMode);
  _applyMode();
};

render();
_applyMode();

// Public-facing builds focus entirely on Work (restaurants) — Tempo and Study stay fully
// intact in code, just hidden from the top tab bar. Add ?allprofiles=1 to the URL (same flag
// used in ui.js) to bring them back for testing, on localhost or the live site.
const _topDevMode = new URLSearchParams(window.location.search).get('allprofiles') === '1';
if (!_topDevMode) {
  $('mainTabBar').style.display = 'none';
  const _oldHeader = document.querySelector('header');
  if (_oldHeader) _oldHeader.style.display = 'none';
}
// Deferred to the window 'load' event — work-tracker/ui.js (which defines WorkTracker) loads
// via a later <script> tag, so calling switchTab('work') immediately here would run before
// WorkTracker exists yet.
window.addEventListener('load', () => switchTab('work'));
</script>

<script>
// Blocks pinch-zoom app-wide — needed because iOS Safari ignores the viewport meta tag's
// user-scalable=no for accessibility reasons, so this is the only reliable way to stop it
// there. Skipped entirely while the photo viewer is open (marked via a class on <body>),
// so pinch-zoom still works normally when actually looking at a proof photo.
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1 && !document.body.classList.contains('wt-photo-zoom-ok')) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', e => {
  if (!document.body.classList.contains('wt-photo-zoom-ok')) e.preventDefault();
}, { passive: false });
</script>
<script>
if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    }).catch(() => {});
  });
}
</script>
