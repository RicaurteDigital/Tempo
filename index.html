<!DOCTYPE html>
<html lang="es-419">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Tempo — sistema operativo de tiempo personal" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempo" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Font preload: Inter Variable latin subset (~38 KB) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Tempo</title>

    <!--
      Token loader: reads design tokens from localStorage synchronously
      and applies them to :root BEFORE the app renders. This prevents
      any flash of default sizes/colors. Dexie (async) is the source
      of truth — theme.ts re-syncs after boot.
    -->
    <script src="/token-loader.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
